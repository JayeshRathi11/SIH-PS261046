services:
  db:
    image: postgres:16-alpine
    container_name: ayutrial-postgres
    restart: always
    environment:
      POSTGRES_USER: ayutrial
      POSTGRES_PASSWORD: ayutrial_secret
      POSTGRES_DB: ayutrial_db
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayutrial -d ayutrial_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayutrial-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://ayutrial:ayutrial_secret@db:5432/ayutrial_db
      SYNC_DATABASE_URL: postgresql://ayutrial:ayutrial_secret@db:5432/ayutrial_db
      SECRET_KEY: ayutrial-ctms-super-secret-key-change-in-prod-2026
      APP_ENV: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
